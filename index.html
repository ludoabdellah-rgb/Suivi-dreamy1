<title>Suivi D1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: tableau de bord d'atelier. Barre d'onglets, filtre de période, puis cartes par département. Chiffres en police condensée, le reste en retrait. */
:root {
  --bg: #EDEFEA; --card: #FBFBF8; --fg: #131B19; --muted: #5A6661; --line: #D3D9D2; --faint: #E4E8E2;
  --ink: #16211F; --on-ink: #F3F5F1; --field: #FFFFFF; --focus: #2A78D6;
  --s1: #2A78D6; --s2: #EB6834; --s3: #1BAF7A;
  --good: #0CA30C; --good-bg: rgba(12,163,12,.13); --good-tx: #005A00;
  --warn: #FAB219; --warn-bg: rgba(250,178,25,.22); --warn-tx: #6B4700;
  --crit: #D03B3B; --crit-bg: rgba(208,59,59,.12); --crit-tx: #9B1C1C;
  --info-bg: rgba(90,102,97,.13);
  --f-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1413; --card: #172120; --fg: #E6EDEA; --muted: #97A5A0; --line: #2B3735; --faint: #202B29;
    --ink: #E6EDEA; --on-ink: #0E1413; --field: #101817; --focus: #6DA7EC;
    --s1: #3987E5; --s2: #D95926; --s3: #199E70;
    --good-tx: #86DB86; --warn-tx: #F2C25C; --crit-tx: #FF9494; --info-bg: rgba(151,165,160,.16);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1413; --card: #172120; --fg: #E6EDEA; --muted: #97A5A0; --line: #2B3735; --faint: #202B29;
  --ink: #E6EDEA; --on-ink: #0E1413; --field: #101817; --focus: #6DA7EC;
  --s1: #3987E5; --s2: #D95926; --s3: #199E70;
  --good-tx: #86DB86; --warn-tx: #F2C25C; --crit-tx: #FF9494; --info-bg: rgba(151,165,160,.16);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.5; padding-inline: 16px; padding-block: 24px 56px; }
.wrap { max-width: 1120px; margin-inline: auto; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; margin: 0; line-height: 1.15; text-wrap: balance; }
h1 { font-size: clamp(30px, 5vw, 42px); font-weight: 700; }
h2 { font-size: 24px; }
h3 { font-size: 20px; }
p { margin: 0; }
.sub { color: var(--muted); }
.muted { color: var(--muted); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.top { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; justify-content: space-between; }
.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 14px 9px; font-family: var(--f-display); font-size: 20px; font-weight: 600; letter-spacing: .02em; color: var(--muted); cursor: pointer; white-space: nowrap; }
.tab[aria-current="page"] { color: var(--fg); border-bottom-color: var(--ink); }
.tab:hover { color: var(--fg); }

.bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 7px 12px; cursor: pointer; font-weight: 500; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.chip small { display: block; font-size: 11.5px; font-weight: 400; opacity: .8; }
.btn { background: var(--ink); color: var(--on-ink); border: 1px solid var(--ink); border-radius: 4px; padding: 9px 16px; font-weight: 600; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
.btn.danger { background: transparent; color: var(--crit-tx); border-color: var(--crit); }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }

.banner { border: 1px solid var(--line); border-left: 4px solid var(--muted); background: var(--info-bg); border-radius: 4px; padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.banner.warn { border-left-color: var(--warn); background: var(--warn-bg); }
.banner.crit { border-left-color: var(--crit); background: var(--crit-bg); }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 18px; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
section.stack { gap: 12px; }
.lead { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px 32px; align-items: end; }
.lead .period { font-family: var(--f-display); font-size: clamp(24px, 4vw, 32px); font-weight: 600; line-height: 1.15; }
.meter { height: 8px; background: var(--faint); border-radius: 2px; overflow: hidden; margin-top: 6px; }
.meter > i { display: block; height: 100%; background: var(--ink); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }

.pill { display: inline-flex; gap: 6px; align-items: center; padding: 2px 8px; border-radius: 3px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.pill.good { background: var(--good-bg); color: var(--good-tx); }
.pill.warn { background: var(--warn-bg); color: var(--warn-tx); }
.pill.crit { background: var(--crit-bg); color: var(--crit-tx); }
.pill.none { background: var(--info-bg); color: var(--muted); }

.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.grid.depts { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.dept { display: flex; flex-direction: column; gap: 12px; }
.dept header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.dept .head { display: flex; flex-direction: column; gap: 0; }
.big { font-family: var(--f-display); font-size: 48px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.big small { font-size: 22px; font-weight: 500; color: var(--muted); margin-left: 4px; }
.dept .lab { color: var(--muted); font-size: 13px; }
dl { margin: 0; display: flex; flex-direction: column; border-top: 1px solid var(--faint); }
dl > div { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--faint); font-size: 14px; }
dt { color: var(--muted); }
dd { margin: 0; font-weight: 500; text-align: right; font-variant-numeric: tabular-nums; }
.foot { color: var(--muted); font-size: 12.5px; }

.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
th { text-align: left; font-weight: 500; font-size: 12.5px; color: var(--muted); letter-spacing: .03em; text-transform: uppercase; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--faint); vertical-align: top; }
td.num, th.num { text-align: right; }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 8px; vertical-align: -1px; }
.rbar { display: flex; align-items: center; gap: 8px; min-width: 150px; }
.rbar > span { flex: 1; height: 8px; background: var(--faint); border-radius: 2px; position: relative; }
.rbar > span > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; }
.rbar > span > b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--fg); }
.rbar em { font-style: normal; min-width: 58px; text-align: right; font-weight: 500; }

.alerts { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
.alerts li { display: flex; gap: 10px; align-items: baseline; }
.notes { display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; list-style: none; }
.notes li { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 12px; }
.notes .who { color: var(--muted); font-size: 13px; }

.chart { width: 100%; height: auto; display: block; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; color: var(--muted); font-size: 13px; align-items: center; }
.legend i { display: inline-block; vertical-align: -2px; margin-right: 6px; }
details summary { cursor: pointer; color: var(--muted); font-size: 13.5px; padding: 4px 0; }
details.dt > summary { color: var(--fg); font-weight: 500; font-size: 15px; }

.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px 16px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field.full, .full { grid-column: 1 / -1; }
.sep { grid-column: 1 / -1; font-family: var(--f-display); font-size: 19px; font-weight: 600; margin: 6px 0 0; padding-top: 12px; border-top: 1px solid var(--faint); }
.form > .sep:first-child { border-top: 0; padding-top: 0; margin-top: 0; }
label, .lbl { font-size: 13.5px; font-weight: 500; }
.hint { font-size: 12.5px; color: var(--muted); }
input[type="number"], input[type="text"], input[type="date"], select, textarea { background: var(--field); border: 1px solid var(--line); border-radius: 4px; padding: 9px 10px; width: 100%; min-width: 0; }
textarea { resize: vertical; min-height: 64px; }
.err { color: var(--crit-tx); font-size: 13px; }
.iv-row { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 2fr) 130px auto; gap: 8px; align-items: center; }
.matrix { display: grid; grid-template-columns: minmax(96px, 1.2fr) repeat(3, minmax(0, 1fr)); gap: 6px; }
.matrix .h { font-size: 12.5px; color: var(--muted); padding: 2px 4px; }
.matrix .r { display: flex; align-items: center; font-weight: 500; font-size: 14px; padding-inline: 4px; }
.cell { min-height: 40px; border: 1px solid var(--line); border-radius: 4px; background: var(--card); cursor: pointer; font-weight: 600; }
.cell.done { background: var(--good-bg); color: var(--good-tx); border-color: var(--good); }
.cell.cur { outline: 2px solid var(--ink); outline-offset: 1px; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 860px) { .two, .lead { grid-template-columns: minmax(0, 1fr); } .notes li { grid-template-columns: minmax(0, 1fr); gap: 0; } .iv-row { grid-template-columns: minmax(0, 1fr) !important; } }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--on-ink); padding: 10px 16px; border-radius: 4px; font-weight: 500; max-width: calc(100vw - 32px); z-index: 20; }
.tip { position: fixed; z-index: 30; pointer-events: none; background: var(--ink); color: var(--on-ink); padding: 6px 10px; border-radius: 4px; font-size: 12.5px; white-space: pre-line; max-width: 260px; }
@media (prefers-reduced-motion: no-preference) { .meter > i { transition: width .3s; } }
@page { size: A4; margin: 12mm; }
@media print {
  .tabs, #banner, #period, .noprint, .actions, #copybox, .toast, .tip { display: none !important; }
  body { background: #fff; padding: 0; font-size: 12px; }
  .wrap { gap: 14px; max-width: none; }
  .dept, tr, .lead, .alerts li, .lotgrid section { break-inside: avoid; }
  .lotgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .lead .hint { display: none; }
  .lotgrid dl > div { padding: 3px 0; font-size: 12.5px; }
  .grid.depts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .dept header { flex-wrap: wrap; }
  h2 { break-after: avoid; font-size: 20px; }
  .big { font-size: 34px; }
  .scroll { overflow: visible; }
  .chart { max-height: 260px; }
}

.lot { display: flex; flex-direction: column; gap: 12px; }
.lot > header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 16px; }
.lot > header h3 { font-size: 26px; }
.lotgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px 22px; }
.lotgrid section { min-width: 0; }
.lotgrid h4 { font-family: var(--f-display); font-size: 17px; font-weight: 600; margin: 0 0 6px; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); }

      saveCfg(function (v) { v.blocked = v.blocked || []; var bi = v.blocked.indexOf(bu); if (allow && bi >= 0) v.blocked.splice(bi, 1); if (!allow && bi < 0) v.blocked.push(bu); }, allow ? "Saisie ouverte" : "Saisie suspendue");
    }
    else if (k === "rperson") { S.rPerson = e.target.value; renderView(); }
    else if (k === "setrole") {
      var uid = e.target.getAttribute("data-id"), u = S.roles.filter(function (x) { return x.user_id === uid; })[0], nr = e.target.value;
      if (!u || !DB || ME.role !== "admin") return;
      if (u.role === "admin" && nr !== "admin" && S.roles.filter(function (x) { return x.role === "admin"; }).length < 2) { toast("Il doit rester au moins un administrateur."); renderView(); return; }
      DB.from("user_roles").upsert({ user_id: uid, email: u.email || null, name: u.name || null, role: nr }, { onConflict: "user_id" }).then(function (r) {
        if (r.error) { toast("Modification refusée"); renderView(); return; }
        return loadRoles().then(function () { toast("Rôle mis à jour : " + (u.name || u.email || "") + " → " + ROLE_LBL[nr]); render(); });
      });
    }
  });
  document.addEventListener("submit", function (e) {
    var k = e.target.getAttribute && e.target.getAttribute("data-form"); if (!k) return;
    e.preventDefault();
    if (k === "report") saveReport(e.target); else if (k === "transfer") saveTransfer(e.target); else if (k === "plan") savePlan(e.target);
  });
  var tip = $("tip");
  document.addEventListener("mousemove", function (e) {
    var el = e.target.closest ? e.target.closest("[data-tip]") : null;
    if (!el) { tip.hidden = true; return; }
    tip.textContent = el.getAttribute("data-tip"); tip.hidden = false;
    var x = e.clientX + 14, y = e.clientY + 14, w = tip.offsetWidth;
    if (x + w > window.innerWidth - 8) x = e.clientX - w - 14;
    tip.style.left = Math.max(8, x) + "px"; tip.style.top = y + "px";
  });
  document.addEventListener("scroll", function () { tip.hidden = true; }, true);

  /* ---------- Démarrage Supabase ---------- */
  function showLogin(message) {
    $("app").hidden = true; $("alarmBtn").hidden = true;
    $("authpanel").style.display = "block";
    $("autherror").textContent = message || "";
  }
  async function enterApp(session) {
    var user = session && session.user;
    if (!user) { ME = { id: null, name: "" }; showLogin(""); return; }
    var md = user.user_metadata || {};
    ME = { id: user.id, name: md.full_name || md.name || user.email || "Utilisateur" };
    NAMES[ME.id] = ME.name; TRIED[ME.id] = 1;
    ME.email = user.email || "";
    $("authpanel").style.display = "none"; $("app").hidden = false; $("alarmBtn").hidden = false;
    S.storage = "db"; S.canWrite = true;
    await loadRoles();
    var firstDept = DEPTS.filter(function (d) { return can(d.id); })[0]; if (firstDept) S.dept = firstDept.id;
    if ((S.tab === "acces" && !(ME.role === "admin" && S.rolesOk)) || (S.tab === "synthese" && ME.role !== "admin")) S.tab = ME.role === "admin" ? "synthese" : "saisie";
    render();
    await loadAll();
    subscribe();
  }
  $("loginform").addEventListener("submit", async function (e) {
    e.preventDefault();
    var email = $("loginemail").value.trim(), password = $("loginpassword").value;
    $("autherror").textContent = "Connexion en cours…";
    try {
      var result = await DB.auth.signInWithPassword({ email: email, password: password });
      if (result.error) throw result.error;
      await enterApp(result.data.session);
    } catch (err) { $("autherror").textContent = "Connexion impossible : " + (err && err.message ? err.message : "vérifiez l’adresse e-mail et le mot de passe."); }
  });
  document.addEventListener("click", async function (e) {
    var el = e.target.closest && e.target.closest('[data-act="logout"]');
    if (!el || !DB) return;
    e.preventDefault();
    try { if (AUTH_CHANNEL) { await DB.removeChannel(AUTH_CHANNEL); AUTH_CHANNEL = null; } await DB.auth.signOut(); }
    finally { ME = { id: null, name: "" }; S.reports = []; S.transfers = []; S.plans = []; S.cfg = null; S.roles = []; S.rolesOk = false; S.ready = false; S.storage = "error"; S.canWrite = false; showLogin("Vous êtes déconnecté."); }
  });
  (async function init() {
    document.querySelectorAll("img.logo").forEach(function (i) { i.src = LOGO; });
    S.date = today(); S.pDate = today();
    var t = lsGet("suivi:tab"), p = lsGet("suivi:period");
    if (t && TABS.some(function (x) { return x[0] === t; })) S.tab = t;
    if (p && PERIODS.some(function (x) { return x[0] === p; })) S.period = p;
    S.partner = lsGet("suivi:partner") || ""; S.from = lsGet("suivi:from") || ""; S.to = lsGet("suivi:to") || "";
    if (!window.supabase || !window.supabase.createClient) { showLogin("Impossible de charger la bibliothèque Supabase. Vérifiez votre connexion Internet."); return; }
    if (!SUPABASE_PUBLISHABLE_KEY || SUPABASE_PUBLISHABLE_KEY.indexOf("REMPLACER_") === 0) { showLogin("Configuration requise : remplacez SUPABASE_PUBLISHABLE_KEY dans le fichier par votre clé publique sb_publishable_."); return; }
    DB = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    try {
      var result = await DB.auth.getSession();
      if (result.error) throw result.error;
      await enterApp(result.data.session);
      DB.auth.onAuthStateChange(function (event, session) {
        if (event === "SIGNED_OUT") { ME = { id: null, name: "" }; S.reports = []; S.transfers = []; S.plans = []; S.cfg = null; S.roles = []; S.rolesOk = false; S.ready = false; showLogin(""); }
        else if (session && session.user && !ME.id) { enterApp(session); }
      });
    } catch (err) { showLogin("Initialisation Supabase impossible : " + (err && err.message ? err.message : "erreur inconnue")); }
  })();
})();
</script>

</body></html>
